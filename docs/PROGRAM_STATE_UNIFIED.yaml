schema_version: 1
project:
  name: RuntimeInspector
  repo_root: D:/Project/Game/UE/PluginMaker/Plugins/RuntimeInspector
  plugin_descriptor: D:/Project/Game/UE/PluginMaker/Plugins/RuntimeInspector/RuntimeInspector.uplugin
  host_project: D:/Project/Game/UE/PluginMaker/PluginMaker.uproject

doc_authority:
  directory: docs
  default_session_entrypoints:
    - docs/PROGRAM_STATE_UNIFIED.yaml
    - docs/STATUS.md
    - docs/FAB_RC_SIGNOFF.md
    - docs/AGENT_DEVELOPMENT.md
  development_authority: docs/AGENT_DEVELOPMENT.md
  troubleshooting_reference: docs/TROUBLESHOOTING.md
  ui_appendix: docs/UI_GUARDRAILS.md
  handoff_role: historical_only

current_baseline:
  branch: codex/runtimeinspector-fab-rc
  implementation_commit: a34a1e4ac3e190db14329cba9e216d591b0eb21d
  implementation_summary: RuntimeInspector Fab technical RC fixes complete
  engine: 5.7
  platform: Win64
  stability_status: technical_rc_release_gate_required_public_url_blocked
  final_commit_authority: Saved/FabRelease/Submission/RuntimeInspector-Fab-Submission.manifest.json

current_focus:
  program_goal: >
    Deliver an auditable RuntimeInspector Fab technical RC whose upload ZIP,
    compiled smoke package, blank-host behavior, documentation, and media are
    consistent and descend from one committed source state.
  current_stage_goal: >
    Hold the verified exact-HEAD UE 5.7 RC stable, resolve the canonical public
    documentation/support URL gate, then fast-forward remote main without force.
  stage_success_criteria:
    - Source ZIP is generated from committed HEAD with clean shipping paths.
    - SourceSubmission and CompiledSmoke contracts pass.
    - UE 5.7 Development and Shipping BuildPlugin pass.
    - RIFabBlank install/load smoke passes without plugin-consequential warnings.
    - Real mouse input reaches Actor, Changes, Settings, and Tools in the exact ZIP-derived blank host.
    - Blank-host Tools can run one self-test and one workflow.
    - Normal and narrow/tall blank-host screenshots are preserved.
    - mainline_full_closure remains 24 of 24 passing.
    - Public documentation and support URLs return HTTP 200.
    - Remote main is updated only by an ordinary fast-forward and never by force.

active_risks:
  - id: final_exact_artifact
    status: closed
    summary: The committed closing state passes the source contract, Development/Shipping BuildPlugin, compiled contract, and RIFabBlank install/load chain; the generated manifest is the final commit and ZIP SHA authority.
  - id: blank_host_real_input
    status: closed
    summary: Exact ZIP-derived RIFabBlank passed real O, four real-mouse tabs, dock_layout, and mainline_safe_patch_core; implementation-identical normal and narrow/tall evidence is preserved.
  - id: public_release_urls
    status: blocked_external_authority
    summary: The canonical MoonFlowFlower/plugin repository and Issues URLs returned HTTP 404 unauthenticated on 2026-08-16; the publisher profile returns HTTP 200, but publisher authorization or an external visibility change is still required for the release destinations.
  - id: marketplace_url
    status: external_pending
    summary: MarketplaceURL can only be finalized after the Fab listing exists.

validation_authority:
  build: PluginMakerEditor Win64 Development
  primary_runtime_entry: toggle_input_via_O_path
  required_evidence:
    - successful_editor_build
    - affected_self_tests_pass
    - mainline_full_closure_pass
    - exact_artifact_contracts_pass
    - real_mouse_blank_host_pass
  closure_rule: >
    Do not claim Fab-ready without exact committed artifact evidence, real input
    evidence, and public release URLs.

release_evidence:
  source_zip: Saved/FabRelease/Submission/RuntimeInspector-Fab-Submission.zip
  source_manifest: Saved/FabRelease/Submission/RuntimeInspector-Fab-Submission.manifest.json
  source_contract: Saved/FabRelease/Submission/RuntimeInspector-Fab-Submission.source-contract.json
  package_root: ../../Saved/FabRelease/Package/RuntimeInspector_UE57/RuntimeInspector
  contracts_root: ../../Saved/FabRelease/Contracts/RuntimeInspector_UE57
  blank_validation_host: ../../Saved/FabRelease/BlankHostLoadSmoke/RIFabBlank_UE57/RIFabBlank/RIFabBlank.uproject
  blank_install_load_log: ../../Saved/FabRelease/fab_blank_host_install_load_smoke_UE57.log
  blank_real_input: Saved/RuntimeInspector/Task5/FinalExactBlankHostRC/final-exact-blank-host-real-input.json
  mainline_closure: Saved/RuntimeInspector/Task5/mainline-full-closure-final-a34.json
  packaged_matrix: Saved/RuntimeInspector/Task5/PackagedGreenA34/packaged-loopback-matrix-final-a34-green.normalized.json
  packaged_lifecycle: Saved/RuntimeInspector/Task5/packaged-run-stop-final-a34-green.json
  media_manifest: FabMedia/fab_media_manifest.json
  demo_path: FabMedia/demo.mp4

claim_boundary:
  not_proven:
    - Fab approval
    - all hardware and DPI combinations
    - asset rights ownership
    - future Unreal Engine compatibility
    - MarketplaceURL before listing creation
