schema_version: 1
project:
  name: RuntimeInspector
  repo_root: /mnt/d/Project/Game/UE/PluginMaker/Plugins/RuntimeInspector
  plugin_descriptor: /mnt/d/Project/Game/UE/PluginMaker/Plugins/RuntimeInspector/RuntimeInspector.uplugin
  host_project: /mnt/d/Project/Game/UE/PluginMaker/PluginMaker.uproject

doc_authority:
  directory: docs
  default_session_entrypoints:
    - docs/PROGRAM_STATE_UNIFIED.yaml
    - docs/STATUS.md
    - docs/codex/tasks/TASK_LANE_INDEX.md
    - docs/AGENT_DEVELOPMENT.md
    - docs/TROUBLESHOOTING.md
  development_authority: docs/AGENT_DEVELOPMENT.md
  troubleshooting_reference: docs/TROUBLESHOOTING.md
  ui_appendix: docs/UI_GUARDRAILS.md
  handoff_role: historical_only

current_baseline:
  branch: codex/runtimeinspector-fab-rc
  product_rc_commit: 88dacaae56b5aa834ec435c2c5d0d5ba91f73762
  product_rc_summary: Fix RuntimeInspector blank host dock scaling
  superseded_product_rc_commit: 0a26995c1f057972bb175afa483326cb1c2df886
  superseded_reason: blank_host_editor_pie_dpi_scaling_bug
  worktree_state: dirty_with_signoff_artifacts
  stability_status: rc_product_patched_artifacts_ready_pending_full_blank_tab_smoke

current_focus:
  program_goal: >
    Keep RuntimeInspector usable as a real runtime inspection, change review,
    validation, and controlled promote workbench inside Editor + PIE.
  current_stage_goal: >
    Finish the full human blank-host tab smoke on the preserved validation host,
    then use the prepared package, screenshots, demo, and checklist for Fab
    submission unless the smoke reveals a product issue.
  stage_success_criteria:
    - Product RC commit is frozen and pushed on codex/runtimeinspector-fab-rc.
    - Package generation passes from the product RC.
    - Blank-host automated load validation passes.
    - Blank-host packaged PIE/open/readability smoke shows side panels are no longer physically tiny.
    - Final listing screenshots are normalized to 1920x1080 and under 3MB each.
    - Demo media exists, is 30-45 seconds, 1080p, and H.264.
    - Full blank-host manual interaction smoke is signed.
    - Signoff docs distinguish repo-local evidence from Fab backend/manual-only follow-ups.
  next_decision_gate: >
    After full blank-host manual tab smoke is signed, decide whether the remaining
    work is only Fab backend metadata/MarketplaceURL or whether a product/package
    patch is needed.

active_risks:
  - id: blank_host_manual_smoke
    status: active
    summary: >
      Automated blank-host load validation passed, and packaged PIE/open/readability
      evidence shows the scaling bug is fixed. Full human tab smoke across
      Actor/Changes/Settings/Tools is still not signed. Do not call the RC
      Fab-ready until this manual step is completed.
  - id: media_submission
    status: mitigated
    summary: >
      Final FabMedia images are normalized to 1920x1080 PNG and under 3MB. The
      demo is 35 seconds, H.264, 1920x1080, and under 25MB. The demo is a
      deterministic screenshot-sequence video, not a live operation recording.
      CaptureFabMedia now skips minimized windows and temporarily foregrounds
      the largest valid PluginMaker Preview window before capture.
  - id: marketplace_url
    status: external_pending
    summary: >
      RuntimeInspector.uplugin MarketplaceURL can only be finalized after the Fab
      listing exists.

validation_authority:
  build: PluginMakerEditor Win64 Development
  primary_runtime_entry: toggle_input_via_O_path
  required_evidence:
    - successful_editor_build
    - affected_self_tests_pass
    - real_user_flow_validation_for_behavior_changes
  preferred_runtime_validation:
    - ue_mcp_or_bridge
    - real_window_screenshot
    - self_test_or_workflow_summary
  closure_rule: >
    Do not claim closed completion without real main-flow evidence; use
    pending-validation or local-only when only compile/self-test evidence exists.

release_evidence:
  product_rc_commit: 88dacaae56b5aa834ec435c2c5d0d5ba91f73762
  package_root: Saved/FabRelease/Package/RuntimeInspector_UE55/RuntimeInspector
  package_log: Saved/build_runtimeinspector_fab_release.log
  blank_validation_host: Saved/FabRelease/BlankProjectValidation/RuntimeInspectorBlank_UE55/RuntimeInspectorBlank/RuntimeInspectorBlank.uproject
  blank_automated_load_log: Saved/fab_blank_project_validation.log
  blank_packaged_pie_readability_evidence:
    - Saved/FabRelease/blank_host_dpi_fix_printwindow.png
    - Saved/FabRelease/blank_host_pid_48944.png
  blank_manual_smoke_status: pending_full_tab_human_signoff
  media_manifest: FabMedia/fab_media_manifest.json
  demo_path: FabMedia/demo.mp4

task_system:
  lane_index: docs/codex/tasks/TASK_LANE_INDEX.md
  task_file_pattern: docs/codex/tasks/<lane>/<task-id>.md
  status_tags:
    - proposed
    - in_progress
    - blocked
    - pending_validation
    - done

session_handoff_policy:
  write_handoff_when:
    - conversation_must_stop_with_unresolved_high_value_state
    - current_state_cannot_be_recovered_quickly_from_program_state_and_status
  do_not_use_handoff_as:
    - default_new_session_entry
    - long_term_project_state_authority
